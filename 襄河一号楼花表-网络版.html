<script>
const DATA = JSON.parse(document.getElementById('rawdata').textContent);
const buildings = DATA.buildings;
const records = DATA.records;
const stats = DATA.stats;
const STATUS = { daishou:{label:'待售',cls:'daishou'}, rengou:{label:'认购',cls:'rengou'}, wangqian:{label:'网签',cls:'wangqian'} };

function stOf(r){
  if (r.wangqian_status) return 'wangqian';
  if (r.customer) return 'rengou';
  return 'daishou';
}
function fmt(v){ if(v===null||v===undefined||v==='') return '—'; return Number(v).toLocaleString('zh-CN',{maximumFractionDigits:2}); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function parseRoom(room){
  room = String(room).trim();
  if (room.includes('/') || room.includes('商')) return null;
  let m = room.match(/^(\d+)(\d{2})$/);
  if (m) return {floor:parseInt(m[1]), unit:parseInt(m[2])};
  return null;
}

// 全局统计
(function(){
  const g = {total:0, daishou:0, rengou:0, wangqian:0};
  records.forEach(r=>{ g.total++; g[stOf(r)]++; });
  const cards = [
    {k:'total', lbl:'总房源', cls:'total'},
    {k:'daishou', lbl:'待售', cls:'daishou'},
    {k:'rengou', lbl:'认购', cls:'rengou'},
    {k:'wangqian', lbl:'网签', cls:'wangqian'},
  ];
  document.getElementById('globalStats').innerHTML = cards.map(c=>
    `<div class="stat-card ${c.cls}"><div class="num">${g[c.k]}</div><div class="lbl">${c.lbl}</div></div>`).join('');
})();

// 楼栋 tabs
(function(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = buildings.map((b,i)=>{
    const s = stats[b];
    return `<div class="tab ${i===0?'active':''}" data-b="${esc(b)}" onclick="selectBld('${esc(b)}', this)">${esc(b)}#<span class="cnt">${s.total}</span></div>`;
  }).join('');
})();

function selectBld(b, el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderBld(b);
}

function renderBld(b){
  const recs = records.filter(r=>r.building===b);
  const houses = recs.filter(r=>parseRoom(r.room)!==null && r.biz_type!=='商铺');
  const shops  = recs.filter(r=>parseRoom(r.room)===null || r.biz_type==='商铺');
  const floors = [...new Set(houses.map(r=>parseRoom(r.room).floor))].sort((a,b)=>b-a);
  const units  = [...new Set(houses.map(r=>parseRoom(r.room).unit))].sort((a,b)=>a-b);
  const cell = {};
  houses.forEach(r=>{ const p=parseRoom(r.room); cell[p.floor+'_'+p.unit]=r; });
  const s = stats[b];

  let gHtml = '';
  if (floors.length){
    let rowsHtml = '';
    floors.forEach(f=>{
      let cellsHtml = '';
      units.forEach(u=>{
        const r = cell[f+'_'+u];
        if (r){
          const st = stOf(r);
          cellsHtml += `<div class="unit ${st}" onclick="openModal('${esc(r.match_no)}')">
            <div class="room-no">${esc(r.room)}</div>
            <div class="meta">${fmt(r.area)}㎡ · ${esc(r.layout)}户型</div>
            <div class="st-tag ${st}">${STATUS[st].label}</div>
            ${r.customer?`<div class="cust">${esc(r.customer)}</div>`:''}
          </div>`;
        } else {
          cellsHtml += '<div class="unit empty"></div>';
        }
      });
      rowsHtml += `<div class="floor-band"><div class="floor-label">${f}F</div><div class="floor-units">${cellsHtml}</div></div>`;
    });
    gHtml = `<div class="elevation"><div class="elev-inner"><div class="elev-top"></div>${rowsHtml}<div class="elev-ground"></div></div></div>`;
  }

  let shopsHtml = '';
  if (shops.length){
    shopsHtml = `<div class="shops"><h3>商铺 / 特殊房源</h3><div class="shop-list">`;
    shops.forEach(r=>{
      const st = stOf(r);
      shopsHtml += `<div class="shop-card ${st}" onclick="openModal('${esc(r.match_no)}')">
        <div class="room-no">${esc(r.room)}</div>
        <div class="cust">${r.customer?esc(r.customer):'待售'}</div>
      </div>`;
    });
    shopsHtml += '</div></div>';
  }

  // 明细表
  let dt = '';
  if (recs.length){
    const rows = recs.map(r=>{
      const st = stOf(r);
      return `<tr class="s-${st}">
        <td>${esc(r.match_no)}</td><td>${esc(r.biz_type)}</td><td>${esc(r.layout)}</td>
        <td>${fmt(r.area)}</td><td>${fmt(r.record_price)}</td><td>${fmt(r.record_total)}</td>
        <td>${esc(r.customer)||'—'}</td><td>${esc(r.wangqian_status)||'—'}</td>
        <td>${esc(r.wangqian_date)||'—'}</td><td>${fmt(r.deal_total)}</td>
        <td><span class="tag ${st}">${STATUS[st].label}</span></td>
      </tr>`;
    }).join('');
    dt = `<div class="detail-table"><h3>${esc(b)}# 房源明细（${recs.length} 套，点击行查看详情）</h3>
      <div class="scroll"><table><thead><tr>
        <th>房号</th><th>业态</th><th>户型</th><th>面积(㎡)</th><th>备案单价</th><th>备案总价</th>
        <th>客户姓名</th><th>网签状态</th><th>网签日期</th><th>成交总价</th><th>状态</th>
      </tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }

  document.getElementById('panel').innerHTML = `
    <h2>${esc(b)}# 楼 <span class="bld-stats">待售 ${s.daishou} · 认购 ${s.rengou} · 网签 ${s.wangqian} · 共 ${s.total} 套</span></h2>
    ${gHtml}${shopsHtml}${dt}`;
}

function findRec(match_no){ return records.find(r=>r.match_no===match_no); }
function openModal(match_no){
  const r = findRec(match_no);
  if (!r) return;
  const st = stOf(r);
  document.getElementById('mTitle').innerHTML = `${esc(r.match_no)} <span class="tag ${st}">${STATUS[st].label}</span>`;
  document.getElementById('mBody').innerHTML = `<table>
    <tr><td class="k">楼栋</td><td>${esc(r.building)}#</td></tr>
    <tr><td class="k">房号</td><td>${esc(r.room)}</td></tr>
    <tr><td class="k">业态</td><td>${esc(r.biz_type)}</td></tr>
    <tr><td class="k">户型</td><td>${esc(r.layout)}</td></tr>
    <tr><td class="k">建筑面积</td><td>${fmt(r.area)} ㎡</td></tr>
    <tr><td class="k">备案单价</td><td>${fmt(r.record_price)} 元/㎡</td></tr>
    <tr><td class="k">备案总价</td><td>${fmt(r.record_total)} 元</td></tr>
    <tr><td class="k">客户姓名</td><td>${esc(r.customer)||'—'}</td></tr>
    <tr><td class="k">网签状态</td><td>${esc(r.wangqian_status)||'—'}</td></tr>
    <tr><td class="k">网签日期</td><td>${esc(r.wangqian_date)||'—'}</td></tr>
    <tr><td class="k">成交总价</td><td>${fmt(r.deal_total)} 元</td></tr>
  </table>`;
  document.getElementById('modalMask').classList.add('show');
}
function closeModal(){ document.getElementById('modalMask').classList.remove('show'); }
document.getElementById('modalMask').addEventListener('click', e=>{ if(e.target.id==='modalMask') closeModal(); });

// 初始渲染第一栋
renderBld(buildings[0]);
</script>
